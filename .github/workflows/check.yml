name: check

# The gate that survives a fresh clone and `git commit --no-verify`: it sees
# the project the way a new contributor's machine does, from nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Without these, apt-get can stop for a debconf or needrestart prompt and
  # wait forever (learned in SurView's CI).
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  gridforge:
    name: GridForge build + tests (${{ matrix.variant }})
    # 26.04 is the first Ubuntu image whose VTK Qt binding is a Qt6 build.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, sanitized]
    steps:
      # Our Netgen fork is a submodule (third_party/netgen), built below.
      # Its own submodule (pybind11) is for Python, which it is built
      # without, so not recursive.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: No em-dashes
        run: tools/check-no-em-dashes.sh

      - name: Install dependencies
        uses: ./.github/actions/apt-deps
        # 60, not 25. With a warm cache this step takes about a minute
        # (SurView's runs, Oct 2026). A COLD run downloads the whole VTK stack
        # (Java bindings included) and took 25 to 33 minutes in SurView; the
        # first TenSense run hit a 25-minute limit, and because the timeout
        # covers the whole composite action it also killed the cache save, so
        # the cache could never warm. The limit must outlast one cold run.
        timeout-minutes: 60
        with:
          cache-key: apt-gridforge-26.04
          need-vtk-qt: 'true'
          packages: >-
            ninja-build cmake g++
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev xvfb
            qt6-svg-plugins
            libyaml-cpp-dev zlib1g-dev
            libocct-foundation-dev libocct-modeling-data-dev
            libocct-modeling-algorithms-dev libocct-data-exchange-dev
            libocct-ocaf-dev libocct-visualization-dev

      # Netgen, built from the commit the submodule pins (tools/build-netgen.sh)
      # and kept between runs under that commit: the build takes minutes, and
      # the same commit always builds the same engine.
      - name: Which Netgen
        id: netgen
        run: echo "commit=$(git -C third_party/netgen rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Restored and saved apart, the save even when a later step fails:
      # with one cache step a red run keeps nothing, and every run until
      # the first green one builds Netgen again (2026-11-18).
      - name: Restore Netgen
        id: netgen-cache
        uses: actions/cache/restore@v4
        with:
          path: build-netgen/install
          key: netgen-26.04-${{ steps.netgen.outputs.commit }}-${{ hashFiles('tools/build-netgen.sh') }}

      - name: Build Netgen
        id: netgen-build
        if: steps.netgen-cache.outputs.cache-hit != 'true'
        run: tools/build-netgen.sh

      - name: Keep Netgen
        if: always() && steps.netgen-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build-netgen/install
          key: netgen-26.04-${{ steps.netgen.outputs.commit }}-${{ hashFiles('tools/build-netgen.sh') }}

      - name: Configure
        run: |
          if [ "${{ matrix.variant }}" = "sanitized" ]; then
            cmake -S . -B build -G Ninja -DGF_SANITIZE=ON
          else
            cmake -S . -B build -G Ninja
          fi

      - name: Build
        run: cmake --build build

      # What this machine is built from, to tell why a mesh differs from
      # the one written elsewhere (docs/survey/netgen-review.md, item 6).
      - name: Versions
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo; grep -m1 -o -w -E 'fma|avx2|avx512f' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          ldd --version | head -1; c++ --version | head -1
          dpkg-query -W -f='${Package} ${Version}\n' 'libocct-foundation*' libc6 'libtbb*' 'libstdc++6' 2>/dev/null

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          # A benchmark mesh that differs from the committed hash is a
          # warning here, not a failure, until the cause is found (David,
          # 2026-11-18; docs/survey/netgen-review.md, item 6). Take this
          # line out when it is.
          GF_MESH_HASH_WARN: '1'
        run: ctest --test-dir build --output-on-failure

      # The benchmark's meshes against the committed hashes, said even when
      # the test passes (it does here while they differ: a warning).
      - name: Benchmark meshes against the baseline
        if: always()
        run: |
          python3 - <<'PY'
          import json
          ran = json.load(open('build/tests/mesher-benchmark.json'))['models']
          kept = json.load(open('tools/mesh-bench/gridforge-baseline.json'))['models']
          for name, r in sorted(ran.items()):
              k = kept.get(name, {})
              same = r.get('mesh hash') == k.get('mesh hash')
              print(f"{name:9} {'same' if same else 'DIFFERS'}: {r['cells']} cells here, {k.get('cells')} in the baseline")
          PY
